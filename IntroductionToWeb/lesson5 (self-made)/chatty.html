<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        @font-face {
            font-family: RoundBlancBold;
            src: url(VDS_Bold_New.ttf);
        }

        body {
            height: 100vh;
            margin: 0;
            font-family: RoundBlancBold;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .smiley {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .face {
            margin-top: 5rem;
            border-radius: 50%;
            width: 10rem;
            height: 10rem;
            background-image: linear-gradient(to bottom, tomato, red, red, red, maroon);
        }

        .eyes {
            display: flex;
            justify-content: space-evenly;
        }

        .eye {
            margin-top: 1.5rem;
            width: 1.5rem;
            height: 3rem;
            background-color: black;
            border-radius: 50%;
        }

        .smile {
            display: flex;
            justify-content: center;
            margin: 1rem;
        }

        .curve {
            width: 80px;
            height: 40px;
            border-bottom: 5px solid black;
            border-radius: 0 0 50px 50px;
        }

        .text {
            margin-top: 1.5rem;
            text-align: center;
        }

        .text p {
            color: white;
            margin: 0;
        }

        .ask {
            margin: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .query input {
            width: 15rem;
            font-family: RoundBlancBold;
            background-color: rgb(255, 50, 50);
            border-radius: 0.25rem;
        }

        .button button {
            width: 30%;
            margin-top: 3rem;
            margin-left: 35%;
            font-family: RoundBlancBold;
            display: flex;
            justify-content: center;
            align-content: center;
            border-radius: 0.25rem;
        }
        
    </style>

</head>
<body>
    <div class="smiley">
        <div class="face">
            <div class="eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="smile">
                <div class="curve"></div>
            </div>
        </div> 
        <div class="text">
            <p>Hello, I'm Chatty! <br> What would you like to ask?</p>
        </div>
        <div class="ask">
            <div class="query">
                <input type="text" spellcheck="true">
            </div>
            <div class="button">
                <button id="ask">Ask away!</button>
            </div>
        </div>
    </div>

    

</body>
</html>
