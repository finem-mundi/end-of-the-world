<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>


    <style>


        @font-face {
            font-family: RoundBlanc;
            src: url(VDS_New.ttf);
        }


        body {
            display: flex;
            justify-content: center;
            align-content: center;
        }


        h1, h2, input, a, p, button {
            font-family: RoundBlanc;
        }


        .input {
            width: 30%;
            height: 50vh;
            background-image: linear-gradient(to bottom, red, maroon);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }


        input {
            width: 50%;
        }


        button {
            width: 50%;
        }

        span {
            color: white;
        }

    </style>


</head>
<body>
    <div class="input">
        <h1>Weather</h1>
        <input type="text" placeholder="Enter city name..." id="nameinput">
        <button id="check">Check</button>
        <h2 id="city"></h2>
        <p><b>Temperature:</b> <span id="temp">0</span> degrees Celsius</p>
        <p><b>Condition:</b> <span id="cond"></span></p>
        <p><b>Wind Speed:</b> <span id="wind"></span> km/h</p>
    </div>


</body>


<script>


    const weatherCodeMap = {
        0: ["Clear Sky"],
        1: ["Mainly Clear"],
        2: ["Partly Cloudy"],
        3: ["Overcast"],
        45: ["Fog"],
        48: ["Depositing Rime Fog"],
        51: ["Light Drizzle"],
        53: ["Moderate Drizzle"],
        55: ["Dense Drizzle"],
        56: ["Light Freezing Drizzle"],
        57: ["Dense Freezing Drizzle"],
        61: ["Slight Rain"],
        63: ["Moderate Rain"],
        65: ["Heavy Rain"],
        66: ["Light Freezing Rain"],
        67: ["Dense Freezing Rain"],
        71: ["Light Snow"],
        73: ["Moderate Snow"],
        75: ["Heavy Snow"],
        77: ["Snow Grains"],
        80: ["Slight Rain Showers"],
        81: ["Moderate Rain Showers"],
        82: ["Violent Rain Showers"],
        85: ["Slight Snow Showers"],
        86: ["Heavy Snow Showers"],
        95: ["Thunderstorm"],
        96: ["Thunderstorm With Slight Hail"],
        99: ["Thunderstorm With Heavy Hail"]
    };


    const cityInput = document.getElementById("nameinput");
    const button = document.getElementById("check");
    button.addEventListener("click", getWeather);


    async function getWeather() {
        const city = cityInput.value.trim();
        console.log(city);
        const geoURL = `https://geocoding-api.open-meteo.com/v1/search?name=${city}`;
        const geoAns = await fetch(geoURL);
        const geoData = await geoAns.json();
        console.log(geoData);


        const lat = geoData.results[0].latitude;
        const long = geoData.results[0].longitude;
        const country = geoData.results[0].country;


        const weatherURL = `https://api.open-meteo.com/v1/forecast/?latitude=${lat}&longitude=${long}&current_weather=true`;
        const weatherAns = await fetch(weatherURL);
        const weatherData = await weatherAns.json();
        console.log(weatherData);


        const temperature = weatherData.current_weather.temperature;
        const windSpeed = weatherData.current_weather.windspeed;
        const weatherCode = weatherData.current_weather.weathercode;
        const weatherCondition = weatherCodeMap[weatherCode];


        document.getElementById("city").innerText = `${city}, ${country}`;
        document.getElementById("temp").innerText = temperature;
        document.getElementById("cond").innerText = weatherCondition;
        document.getElementById("wind").innerText = windSpeed;
    }


</script>


</html>
