<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>

    <style>

        h1 {
            font-family: Helvetica;
        }

        p {
            font-family: Helvetica;
        }

        p:hover {
            color: maroon;
        }

        p:active {
            color: red;
            font-style: italic;
        }

    </style>

</head>
<body>
    <h1>Welcome to My Web Page</h1>
    <p>This is a simple web page created as an example.</p>
    <p>This is an example.</p>
</body>

</html>
