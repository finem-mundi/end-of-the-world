<!--

Lesson 4: Flexbox, Grid, and Responsive

y axis - cross axis
x axis - main axis

<768px - phone
768px+ - tablet
1024px+ - computer/PC screen
1280px+ - bigger screens

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .container {
            margin-bottom: 10px;
            width: 100%;
            height: 500px;
            background-color: black;
            display: flex;
            align-items: center;
        }

        .red {
            width: 300px;
            height: 300px;
            background-color: red;
        }

        .green {
            width: 300px;
            height: 300px;
            background-color: green;
        }

        .blue {
            width: 300px;
            height: 300px;
            background-color: blue;
        }

    </style>

</head>
<body>
    
    <div class="container" style="justify-content: flex-start;">

        <div class="red"></div>
        <div class="green"></div>
        <div class="blue"></div>

    </div>

    <div class="container" style="justify-content: end;">

        <div class="red"></div>
        <div class="green"></div>
        <div class="blue"></div>

    </div>

    <div class="container" style="justify-content: center;">

        <div class="red"></div>
        <div class="green"></div>
        <div class="blue"></div>

    </div>

    <div class="container" style="justify-content: space-around;">

        <div class="red"></div>
        <div class="green"></div>
        <div class="blue"></div>

    </div>

    <div class="container" style="justify-content: space-between;">

        <div class="red"></div>
        <div class="green"></div>
        <div class="blue"></div>

    </div>

    <div class="container" style="justify-content: space-evenly;">

        <div class="red"></div>
        <div class="green"></div>
        <div class="blue"></div>

    </div>

</body>
</html>
