<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <style>

        @font-face {
            font-family: TicTac;
            src: url(TicTacToe.ttf);
        }

        h1 {
            font-family: TicTac;
            font-size: 5rem;
        }

        h2 {
            font-family: TicTac;
            font-size: 3rem;
        }

        body {
            background-image: url("https://wallpapers.com/images/hd/lined-paper-background-1920-x-1080-0ubrkgh8v1xize1j.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .container {
            background-color: black;
            width: 25rem;
            height: 25rem;
            display: grid;
            grid-template-columns: repeat(3, 3fr);
            place-items: center;
            gap: 0;
            padding: 0.5rem;
            border-radius: 0.5rem;
        }

        .sq1, .sq2, .sq3, .sq4, .sq5, .sq6, .sq7, .sq8, .sq9 {
            background-color: rgb(242, 235, 144);
            width: 7.5rem;
            height: 7.5rem;
            border-radius: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sq1:hover, .sq2:hover, .sq3:hover, .sq4:hover, .sq5:hover, .sq6:hover, .sq7:hover, .sq8:hover, .sq9:hover {
            background-color: rgb(212, 205, 114);
            transition: 0.5s;
        }



    </style>

</head>
<body>
    <h1>Tic Tac Toe</h1>
    <h2 id="turn">X's turn</h2>
    <div class="container">
        <div class="sq1" onclick="sq1()"><h1 id="sq11"></h1></div>
        <div class="sq2" onclick="sq2()"><h1 id="sq21"></h1></div>
        <div class="sq3" onclick="sq3()"><h1 id="sq31"></h1></div>
        <div class="sq4" onclick="sq4()"><h1 id="sq41"></h1></div>
        <div class="sq5" onclick="sq5()"><h1 id="sq51"></h1></div>
        <div class="sq6" onclick="sq6()"><h1 id="sq61"></h1></div>
        <div class="sq7" onclick="sq7()"><h1 id="sq71"></h1></div>
        <div class="sq8" onclick="sq8()"><h1 id="sq81"></h1></div>
        <div class="sq9" onclick="sq9()"><h1 id="sq91"></h1></div>
    </div>
</body>

<script>
    let currentTurn = 1;
    let gameOver = false;
    let currentTurnText = document.getElementById("turn");

    let sq1text = document.getElementById("sq11");
    let sq2text = document.getElementById("sq21");
    let sq3text = document.getElementById("sq31");
    let sq4text = document.getElementById("sq41");
    let sq5text = document.getElementById("sq51");
    let sq6text = document.getElementById("sq61");
    let sq7text = document.getElementById("sq71");
    let sq8text = document.getElementById("sq81");
    let sq9text = document.getElementById("sq91");

    let sq10 = 0, sq20 = 0, sq30 = 0;
    let sq40 = 0, sq50 = 0, sq60 = 0;
    let sq70 = 0, sq80 = 0, sq90 = 0;

    function sq1() {
        if (sq1text.innerHTML !== "") {
            return;
        }
        if (currentTurn === 1) {
            sq1text.innerHTML = "X";
            currentTurnText.innerHTML = "O's turn";
            currentTurn = 0;
            sq10 = 2;
        } 
        else if (currentTurn === 0) {
            sq1text.innerHTML = "O";
            currentTurnText.innerHTML = "X's turn";
            currentTurn = 1;
            sq10 = 1;
        }
        check();
    }

    function sq2() {
        if (sq2text.innerHTML !== "") {
            return;
        }
        if (currentTurn === 1) {
            sq2text.innerHTML = "X";
            currentTurnText.innerHTML = "O's turn";
            currentTurn = 0;
            sq20 = 2;
        }
        else if (currentTurn === 0) {
            sq2text.innerHTML = "O";
            currentTurnText.innerHTML = "X's turn";
            currentTurn = 1;
            sq20 = 1;
        }
        check();
    }

    function sq3() {
        if (sq3text.innerHTML !== "") {
            return;
        }
        if (currentTurn === 1) {
            sq3text.innerHTML = "X";
            currentTurnText.innerHTML = "O's turn";
            currentTurn = 0;
            sq30 = 2;
        }
        else if (currentTurn === 0) {
            sq3text.innerHTML = "O";
            currentTurnText.innerHTML = "X's turn";
            currentTurn = 1;
            sq30 = 1;
        }
        check();
    }

    function sq4() {
        if (sq4text.innerHTML !== "") {
            return;
        }
        if (currentTurn === 1) {
            sq4text.innerHTML = "X";
            currentTurnText.innerHTML = "O's turn";
            currentTurn = 0;
            sq40 = 2;
        }
        else if (currentTurn === 0) {
            sq4text.innerHTML = "O";
            currentTurnText.innerHTML = "X's turn";
            currentTurn = 1;
            sq40 = 1;
        }
        check();
    }

    function sq5() {
        if (sq5text.innerHTML !== "") {
            return;
        }
        if (currentTurn === 1) {
            sq5text.innerHTML = "X";
            currentTurnText.innerHTML = "O's turn";
            currentTurn = 0;
            sq50 = 2;
        }
        else if (currentTurn === 0) {
            sq5text.innerHTML = "O";
            currentTurnText.innerHTML = "X's turn";
            currentTurn = 1;
            sq50 = 1;
        }
        check();
    }

    function sq6() {
        if (sq6text.innerHTML !== "") {
            return;
        }
        if (currentTurn === 1) {
            sq6text.innerHTML = "X";
            currentTurnText.innerHTML = "O's turn";
            currentTurn = 0;
            sq60 = 2;
        }
        else if (currentTurn === 0) {
            sq6text.innerHTML = "O";
            currentTurnText.innerHTML = "X's turn";
            currentTurn = 1;
            sq60 = 1;
        }
        check();
    }

    function sq7() {
        if (sq7text.innerHTML !== "") {
            return;
        }
        if (currentTurn === 1) {
            sq7text.innerHTML = "X";
            currentTurnText.innerHTML = "O's turn";
            currentTurn = 0;
            sq70 = 2;
        }
        else if (currentTurn === 0) {
            sq7text.innerHTML = "O";
            currentTurnText.innerHTML = "X's turn";
            currentTurn = 1;
            sq70 = 1;
        }
        check();
    }

    function sq8() {
        if (sq8text.innerHTML !== "") {
            return;
        }
        if (currentTurn === 1) {
            sq8text.innerHTML = "X";
            currentTurnText.innerHTML = "O's turn";
            currentTurn = 0;
            sq80 = 2;
        }
        else if (currentTurn === 0) {
            sq8text.innerHTML = "O";
            currentTurnText.innerHTML = "X's turn";
            currentTurn = 1;
            sq80 = 1;
        }
        check();
    }

    function sq9() {
        if (sq9text.innerHTML !== "") {
            return;
        }
        if (currentTurn === 1) {
            sq9text.innerHTML = "X";
            currentTurnText.innerHTML = "O's turn";
            currentTurn = 0;
            sq90 = 2;
        }
        else if (currentTurn === 0) {
            sq9text.innerHTML = "O";
            currentTurnText.innerHTML = "X's turn";
            currentTurn = 1;
            sq90 = 1;
        }
        check();
    }

    function check() {
        if (
            (sq10 == 1 && sq40 == 1 && sq70 == 1) ||
            (sq20 == 1 && sq50 == 1 && sq80 == 1) ||
            (sq30 == 1 && sq60 == 1 && sq90 == 1) ||
            (sq10 == 1 && sq20 == 1 && sq30 == 1) ||
            (sq40 == 1 && sq50 == 1 && sq60 == 1) ||
            (sq70 == 1 && sq80 == 1 && sq90 == 1) ||
            (sq10 == 1 && sq50 == 1 && sq90 == 1) ||
            (sq30 == 1 && sq50 == 1 && sq70 == 1)
        ) {
            currentTurnText.innerHTML = "O Wins!";
            gameOver = true;
        }

        else if (
            (sq10 == 2 && sq40 == 2 && sq70 == 2) ||
            (sq20 == 2 && sq50 == 2 && sq80 == 2) ||
            (sq30 == 2 && sq60 == 2 && sq90 == 2) ||
            (sq10 == 2 && sq20 == 2 && sq30 == 2) ||
            (sq40 == 2 && sq50 == 2 && sq60 == 2) ||
            (sq70 == 2 && sq80 == 2 && sq90 == 2) ||
            (sq10 == 2 && sq50 == 2 && sq90 == 2) ||
            (sq30 == 2 && sq50 == 2 && sq70 == 2)
        ) {
            currentTurnText.innerHTML = "X Wins!";
            gameOver = true;
        }

        else if (
            sq10 != 0 && sq20 != 0 && sq30 != 0 &&
            sq40 != 0 && sq50 != 0 && sq60 != 0 &&
            sq70 != 0 && sq80 != 0 && sq90 != 0
        ) {
            currentTurnText.innerHTML = "It's a Tie!";
            gameOver = true;
        }
    }
</script>


</script>

</html>
