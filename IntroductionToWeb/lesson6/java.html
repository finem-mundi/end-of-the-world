<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>

    <input type="number" id="num1"> <br>
    <input type="number" id="num2"> <br>
    <input type="number" id="num3"> <br>
    <input type="number" id="num4"> <br>
    <input type="number" id="num5"> <br>
    <input type="number" id="num6"> <br>

    <button onclick="calculateGrade()">1. дүнгийн тооцоолуур</button> <br> <br>

    <input type="number" id="prime"> <br>
    <button onclick="isPrime()">2. анхны тоо олох</button>

    <script>

        function getGrade(score) {
            if (score > 89) {
                console.log("Score:", score, "-> A");
            } else if (score > 79) {
                console.log("Score:", score, "-> B");
            } else if (score > 69) {
                console.log("Score:", score, "-> C");
            } else {
                console.log("Score:", score, "-> F");
            }

            isPassed(score);
        }

        let count = 0;

        function isPassed(score) {
            if (score > 69) {
                count++;
            }
        }

        function calculateGrade() {

            const num1 = Number(document.getElementById("num1").value.trim());
            const num2 = Number(document.getElementById("num2").value.trim());
            const num3 = Number(document.getElementById("num3").value.trim());
            const num4 = Number(document.getElementById("num4").value.trim());
            const num5 = Number(document.getElementById("num5").value.trim());
            const num6 = Number(document.getElementById("num6").value.trim());

            getGrade(num1);
            getGrade(num2);
            getGrade(num3);
            getGrade(num4);
            getGrade(num5);
            getGrade(num6);
            console.log("Number of passed students:", count);
        }

        let count2 = 0;
        let primes = "";

        function isPrime() {
            const primemax = Number(document.getElementById("prime").value);
            for (let n = 1; n <= primemax; n++) {
                let primecount = 0;
                for (let o = 1; o <= n; o++) {
                    if (n % o === 0) {
                        primecount++;
                    }
                }

                if (primecount == 2) {
                    count2++;
                    primes += n + " ";
                }
            }
            console.log(primes);
            console.log("Number of prime numbers under" , primemax,":", count2);
        }

    </script>
</body>
</html>
