<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Browser</title>
</head>


<body>


  <style>


html {
    font-size: 64px;
    font-family: 'Courier New', Courier, monospace;
    font-weight: bold;
}


body {
    margin: 0;
    display: flex;
    height: 100vh;
    overflow: hidden;
}


#left, #right {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}


#left div, #right div #vs {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 2rem;
    width: 2rem;
}


#right, #left div {
    background-color: #c00;
    color: #fff;
}


#left, #right div {
    background-color: #fff;
    color: #c00;
}


#vs {
    background-color: black;
    color: #fff;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 2rem;
    width: 2rem;
    font-size: 0.5rem;
    user-select: none;
}


.score {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 2rem;
    width: 2rem;
    user-select: none;
}


  </style>


  <div id="left" class="side">
    <div class="score red" id="leftScore">0</div>
  </div>
  <div id="vs">VS</div>
  <div id="right" class="side">
    <div class="score white" id="rightScore">0</div>
  </div>
  <script>
 
var leftArea = document.getElementById('left');
var leftCircle = document.getElementById('leftScore');
var rightArea = document.getElementById('right');
var rightCircle = document.getElementById('rightScore');
var vs = document.getElementById('vs');


function updateVS() {
    var l = parseFloat(leftArea.style.flex || 1);
    var r = parseFloat(rightArea.style.flex || 1);
    var percentage = (l / (l + r)) * 100;
    vs.style.left = percentage + '%';
}


window.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowLeft') {
        var score = parseInt(leftCircle.innerText) + 1;
        leftCircle.innerText = score;
        leftArea.style.flex = score + 1;
        updateVS();


        if (score >= 100) {
            alert("Left side wins!");
        }


    }
    else if (event.key === 'ArrowRight') {
        var score = parseInt(rightCircle.innerText) + 1;
        rightCircle.innerText = score;
        rightArea.style.flex = score + 1;
        updateVS();


        if (score >= 100) {
            alert("Right side wins!");
        }


    }
});


  </script>
</body>


</html>
