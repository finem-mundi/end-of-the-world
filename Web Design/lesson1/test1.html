<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 1: Web and HTML Basics</title>

    <style>

        h1 {
            font-family: Helvetica;
        }

        h2 {
            font-family: Helvetica;
        }

        h2:hover {
            color: maroon;
        }

        h2:active {
            color: red;
            font-style: italic;
        }

    </style>

</head>
<body>
    <h1>Hello</h1>
    <h2>This is a squishy button.</h2>
</body>

</html>
